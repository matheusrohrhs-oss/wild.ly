<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WILD.LY - Portal do Rift</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>


  <header class="header-main">
    <div class="header-left">
      <button class="hamburger-btn">&#9776;</button>
      <div class="brand-logo">
        <img src="imagem/logo.png" alt="WILD.LY Logo" class="logo-img" />
      </div>
    </div>

    
    <div class="header-center">
      <div class="game-selector-toggle">
        <button class="game-tab-btn active" id="tabWR" onclick="switchGame('wr')">📱 Wild Rift</button>
        <button class="game-tab-btn" id="tabPC" onclick="switchGame('pc')">💻 LoL PC</button>
      </div>
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Buscar builds, dicas, campeões..." />
      </div>
    </div>

    <div class="header-right">
      <div class="user-profile-badge" onclick="openProfileModal()">
        <div class="user-avatar-icon" id="headerAvatar">
          <span style="color: var(--border-gold); font-size: 0.8rem;">👤</span>
        </div>
        <div class="user-info-text">
          <span class="user-name-display">REMOVAM A ASHE</span>
          <span class="user-ranks-display">Esmeralda | Peak: Grão-Mestre</span>
        </div>
      </div>
      <button class="btn-create-tip">+ Criar Dica</button>
    </div>
  </header>

  
  <div class="app-layout">
    <aside class="sidebar-block">
      <h2 class="sidebar-title">Navegação</h2>
      <ul class="sidebar-menu">
        <li class="active"><i>&#127968;</i> Início</li>
        <li><i>&#127942;</i> Tier List</li>
        <li><i>&#128216;</i> Builds</li>
        <li><i>&#128101;</i> Comunidade</li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="role-filter-bar">
        <button class="role-btn active">Todos</button>
        <button class="role-btn">Barão / Top</button>
        <button class="role-btn">Selva (Jungle)</button>
        <button class="role-btn">Mid</button>
        <button class="role-btn">ADC</button>
        <button class="role-btn">Suporte</button>
      </div>

      <p class="section-label" id="currentSectionLabel">PUBLICAÇÕES RECENTES - WILD RIFT</p>

      <div class="cards-grid" id="cardsGrid">
      </div>
    </main>

    <aside class="project-info-card">
      <h2 class="info-title">Sobre o Projeto</h2>
      <div class="info-body">
        <p>O conhecimento do Rift em um só lugar.</p>
        <p class="author-name">Desenvolvido para a comunidade.</p>
      </div>
    </aside>
  </div>

  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">CONFIGURAR PERFIL DE INVOCADOR</h3>
        <button class="close-modal" onclick="closeProfileModal()">&times;</button>
      </div>

      <form id="profileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label for="profileNick">Nome no Jogo / Nickname</label>
          <input type="text" id="profileNick" value="REMOVAM A ASHE" required />
        </div>

        <div class="form-group">
          <label for="profileGame">Jogo Principal</label>
          <select id="profileGame" onchange="onProfileGameChange()">
            <option value="wr">Wild Rift (Mobile)</option>
            <option value="pc">League of Legends (PC)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="profileAvatar">Campeão Favorito</label>
          <select id="profileAvatar" onchange="onChampionChange(this.value)">
            <option value="">-- Selecione um Campeão --</option>
          </select>
        </div>

        
        <div class="form-group">
          <label for="profileSkin">Skin / Splash Art do Perfil</label>
          <select id="profileSkin" onchange="previewAvatarWithSkin()">
            <option value="0">Skin Padrão</option>
          </select>
        </div>

        
        <div class="avatar-select-wrapper" style="margin-bottom: 1rem; text-align: center;">
          <img id="avatarPreview" src="" alt="Preview Avatar" class="avatar-preview-img" style="display: none; width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-gold, #c8aa6e); margin: 0 auto;" />
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="profileCurrentRank">Elo Atual</label>
            <input type="text" id="profileCurrentRank" value="Esmeralda" />
          </div>
          <div class="form-group flex-1">
            <label for="profilePeakRank">Peak Elo (Maior Elo)</label>
            <input type="text" id="profilePeakRank" value="Grão-Mestre" />
          </div>
        </div>

        <button type="submit" class="btn-submit">Salvar Perfil</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
